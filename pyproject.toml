[project]
name = "personal-assistant"
version = "0.2.0"
description = "AI Personal Assistant web app for persistent audio capture and OpenAI transcription"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "openai>=1.50.0"
]

[project.scripts]
personal-assistant = "personal_assistant.launch:main"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
